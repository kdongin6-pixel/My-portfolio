<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="포트폴리오">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1b1a">
<title>포트폴리오</title>
<!-- APP_VERSION: src/constants.js 에서 관리 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="src/styles.css">
<style>
/* Compact status and predictable one-line labels at narrow widths. */
.notice-collapse>summary{display:flex;align-items:center;gap:4px;min-width:0;min-height:44px}
.notice-line{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice-collapse .notice-warning{flex:none;white-space:nowrap;margin:0}
.compact-holding{flex-wrap:nowrap;gap:8px}
.holding-name,.holding-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.holding-name{flex:1 1 0}.holding-value{flex:0 1 auto}
.holding-name small,.holding-value small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-name,.gs-sub,.mkt-item-price,.mkt2-comm-price,.mkt2-idx-price,.mkt2-rate-price,.mkt2-tech-price{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.data-notice,.quote-provenance,.analysis-empty{overflow-wrap:break-word;text-wrap:pretty}
h1,h2,h3{text-wrap:balance}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://accounts.google.com/gsi/client" async onload="window.dispatchEvent(new Event('google-identity-ready'))"></script>
</head>
<body>
<div id="app"></div>
<script type="module" src="src/main.js"></script>
<script>
// PWA 서비스 워커 등록 (오프라인 지원 + 홈 화면 설치)
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
